services:
  - type: web
    name: dusty-tape-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 8 --timeout 180 --keep-alive 30 server:app
    healthCheckPath: /health
    autoDeploy: true